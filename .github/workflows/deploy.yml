name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare `public_html`
        run: |
          rm -rf public_html || true
          mkdir -p public_html
          rsync -av --exclude='.git' --exclude='.github' --exclude='public_html' ./ public_html/

      - name: List `public_html` (debug)
        run: |
          echo "Contents of public_html:"
          ls -la public_html || true
          du -sh public_html || true

      - name: Deploy to gh-pages via peaceiris
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public_html
          publish_branch: gh-pages
