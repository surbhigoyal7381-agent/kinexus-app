name: Deploy static site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare `public_html`
        run: |
          rm -rf public_html || true
          mkdir -p public_html
          rsync -av --exclude='.git' --exclude='.github' --exclude='public_html' ./ public_html/

      - name: List `public_html` (debug)
        run: |
          echo "Contents of public_html:"
          ls -la public_html || true
          du -sh public_html || true

      - name: Upload site artifact for Pages
        uses: actions/upload-pages-artifact@v1
        with:
          path: public_html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
