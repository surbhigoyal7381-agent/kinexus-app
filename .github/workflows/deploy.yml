name: Deploy to MilesWeb Hosting

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate db-config.php from secrets
        env:
          DB_HOST: ${{ secrets.DB_HOST || '103.212.121.63' }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_CHARSET: ${{ secrets.DB_CHARSET || 'utf8mb4_unicode_ci' }}
          DB_SSL: ${{ secrets.DB_SSL || 'true' }}
          DB_NAME: ${{ secrets.DB_NAME || 'kinexus_1_website' }}
          DB_USER: ${{ secrets.DB_USER || 'kinexus_1_admin' }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          python3 <<'PY'
          import os

          def php_string(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          def php_bool(value):
              return "true" if value.strip().lower() in ("1", "true", "yes", "on") else "false"

          config = {
              "DB_HOST": os.environ["DB_HOST"],
              "DB_PORT": os.environ["DB_PORT"],
              "DB_NAME": os.environ["DB_NAME"],
              "DB_USER": os.environ["DB_USER"],
              "DB_PASS": os.environ["DB_PASS"],
              "DB_CHARSET": os.environ["DB_CHARSET"],
          }

          with open("db-config.php", "w", encoding="utf-8") as file:
              file.write("<?php\n")
              for key, value in config.items():
                  file.write(f"define('{key}', {php_string(value)});\n")
              file.write(f"define('DB_SSL', {php_bool(os.environ['DB_SSL'])});\n")
          PY

      # The FTP-Deploy-Action silently fails to create new remote directories on
      # this LiteSpeed/FTP host (it logs "creating folder" but the MKD never lands,
      # so files uploaded into a fresh folder vanish while the run still reports
      # success). Pre-create required subdirectories with lftp, which surfaces real
      # MKD errors, so the upload step below lands blog/ files into an existing dir.
      # The FTP-Deploy-Action (Node basic-ftp) uploads files fine but silently
      # fails to create the new remote blog/ directory, so every /blog/* URL 404s.
      # Create it out-of-band with curl, matching the action's transport (explicit
      # FTPS on port 21). MKD runs as a pre-command; the "*" prefix ignores the
      # "directory already exists" error so the step is idempotent. Hard timeouts
      # guarantee it can never hang the job.
      - name: Ensure remote blog directory exists
        continue-on-error: true
        timeout-minutes: 4
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          C="curl --ssl-reqd -k --connect-timeout 20 --max-time 60 -u $FTP_USERNAME:$FTP_PASSWORD"
          echo "=== DIAG: login-root listing (is public_html here?) ==="
          $C -s "ftp://kinexus.co.in/" || echo "(root list rc=$?)"
          echo "=== DIAG: /public_html/ listing (does blog exist? perms?) ==="
          $C -s "ftp://kinexus.co.in/public_html/" || echo "(public_html list rc=$?)"
          echo "=== DIAG: MKD /public_html/blog (server responses) ==="
          $C -v -Q "MKD /public_html/blog" "ftp://kinexus.co.in/public_html/" -o /dev/null 2>&1 \
            | grep -E '^(< |\* )' || true

      - name: Deploy via FTP to MilesWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: kinexus.co.in
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          state-name: .ftp-deploy-sync-state-v3.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .vscode/**
            archive/**
            assets/Archive/**
            blog/_template.html
            blog/HOW-TO-ADD-A-POST.md
            README.md
